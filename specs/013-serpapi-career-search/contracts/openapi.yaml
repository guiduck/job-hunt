openapi: 3.1.0
info:
  title: Curated Career Page Search Contracts
  version: 0.1.0
  description: Contract additions for specs/013-serpapi-career-search.
servers:
  - url: http://localhost:8000
security:
  - bearerAuth: []
paths:
  /job-search/curated-sources:
    get:
      summary: List active curated career-page sources
      operationId: listCuratedCareerSources
      responses:
        "200":
          description: Active source metadata
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources:
                    type: array
                    items:
                      $ref: "#/components/schemas/CuratedCareerSource"
  /job-search-runs/career-page:
    post:
      summary: Create a fresh career-page search run
      operationId: createCareerPageSearchRun
      description: Every call creates a fresh owner-scoped provider search run. The API must reject duplicate active career-page runs for the same user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareerPageSearchRunCreate"
      responses:
        "201":
          description: Run created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobSearchRun"
        "400":
          description: Invalid keywords, selected sources, or opportunity limit
        "401":
          description: Missing or invalid auth
        "409":
          description: A career-page search is already pending or running for this user
        "503":
          description: Search provider is not configured
  /job-search-runs/latest:
    get:
      summary: Get latest run by search kind
      operationId: getLatestJobSearchRun
      parameters:
        - name: search_kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SearchKind"
        - name: opportunity_type
          in: query
          required: false
          schema:
            type: string
            enum: [job]
      responses:
        "200":
          description: Latest matching run or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  run:
                    anyOf:
                      - $ref: "#/components/schemas/JobSearchRun"
                      - type: "null"
  /job-search-runs/{run_id}:
    get:
      summary: Read search run status and counters
      operationId: getJobSearchRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobSearchRun"
        "404":
          description: Run not found for current user
  /job-search-runs/{run_id}/candidates:
    get:
      summary: List candidates for a run
      operationId: listJobSearchCandidates
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Candidate diagnostics
          content:
            application/json:
              schema:
                type: object
                required: [candidates]
                properties:
                  candidates:
                    type: array
                    items:
                      $ref: "#/components/schemas/JobSearchCandidate"
  /opportunities:
    get:
      summary: List opportunities with job lane filters
      operationId: listOpportunities
      parameters:
        - name: opportunity_type
          in: query
          required: true
          schema:
            type: string
            enum: [job]
        - name: job_application_kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/JobApplicationKind"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Paginated opportunities
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Opportunity"
                  total:
                    type: integer
  /opportunities/{opportunity_id}/mark-applied:
    patch:
      summary: Mark an external application as manually applied
      operationId: markOpportunityApplied
      parameters:
        - $ref: "#/components/parameters/OpportunityId"
      responses:
        "200":
          description: Updated opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"
        "400":
          description: Opportunity is not a job opportunity or cannot be marked applied
        "404":
          description: Opportunity not found for current user
  /opportunities/metrics:
    get:
      summary: Get Full-time dashboard metrics
      operationId: getOpportunityMetrics
      parameters:
        - name: opportunity_type
          in: query
          required: true
          schema:
            type: string
            enum: [job]
      responses:
        "200":
          description: Metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityMetrics"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
    OpportunityId:
      name: opportunity_id
      in: path
      required: true
      schema:
        type: string
  schemas:
    SearchKind:
      type: string
      enum: [linkedin, career_page]
    JobSearchRunStatus:
      type: string
      enum: [pending, running, completed, completed_no_results, failed]
    ProviderStatus:
      type: string
      enum: [not_started, collected, partial, blocked, inaccessible, empty, failed]
    JobApplicationKind:
      type: string
      enum: [email, external_application]
    StopReason:
      type: string
      enum: [accepted_limit_reached, candidate_cap_reached, no_more_results, provider_failed, cancelled, unknown]
    CuratedCareerSource:
      type: object
      required: [key, display_name, source_category, active, enabled_by_default]
      properties:
        key:
          type: string
        display_name:
          type: string
        source_category:
          type: string
          enum: [ats, career_page, job_site]
        active:
          type: boolean
        enabled_by_default:
          type: boolean
    CareerPageSearchRunCreate:
      type: object
      required: [keywords, selected_sources, accepted_opportunity_limit]
      properties:
        keywords:
          type: array
          minItems: 1
          items:
            type: string
        search_query:
          type: string
        selected_sources:
          type: array
          minItems: 1
          items:
            type: string
            enum: [inhire, ashby, lever, greenhouse, smartrecruiters, trampos, catho]
        accepted_opportunity_limit:
          type: integer
          minimum: 1
          maximum: 100
        ai_evaluation_enabled:
          type: boolean
          default: true
    JobSearchRun:
      type: object
      required:
        - id
        - user_id
        - search_kind
        - status
        - requested_keywords
        - selected_sources
        - accepted_opportunity_limit
        - inspected_count
        - accepted_count
        - rejected_count
        - duplicate_count
        - provider_status
        - created_at
        - updated_at
      properties:
        id:
          type: string
        user_id:
          type: string
        search_kind:
          $ref: "#/components/schemas/SearchKind"
        status:
          $ref: "#/components/schemas/JobSearchRunStatus"
        requested_keywords:
          type: array
          items:
            type: string
        search_query:
          type: string
        selected_sources:
          type: array
          items:
            type: string
        accepted_opportunity_limit:
          type: integer
        inspected_candidate_cap:
          type: integer
        inspected_count:
          type: integer
        accepted_count:
          type: integer
        rejected_count:
          type: integer
        duplicate_count:
          type: integer
        cap_reached:
          type: boolean
        stop_reason:
          $ref: "#/components/schemas/StopReason"
        provider_status:
          $ref: "#/components/schemas/ProviderStatus"
        provider_error_code:
          type: string
        provider_error_message:
          type: string
        source_diagnostics:
          type: object
          additionalProperties: true
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    JobSearchCandidate:
      type: object
      required: [id, run_id, outcome, source_query, created_at]
      properties:
        id:
          type: string
        run_id:
          type: string
        opportunity_id:
          type: string
        outcome:
          type: string
        curated_source_key:
          type: string
        provider_name:
          type: string
        company_name:
          type: string
        role_title:
          type: string
        job_description:
          type: string
        source_url:
          type: string
        apply_url:
          type: string
        contact_email:
          type: string
        application_kind:
          $ref: "#/components/schemas/JobApplicationKind"
        source_query:
          type: string
        source_evidence:
          type: string
        matched_keywords:
          type: array
          items:
            type: string
        match_score:
          type: integer
          minimum: 0
          maximum: 100
        score_explanation:
          type: string
        analysis_status:
          type: string
        dedupe_key:
          type: string
        rejection_reason:
          type: string
        created_at:
          type: string
          format: date-time
    Opportunity:
      type: object
      required: [id, opportunity_type, source_evidence, captured_at]
      properties:
        id:
          type: string
        opportunity_type:
          type: string
          enum: [job]
        title:
          type: string
        organization_name:
          type: string
        source_name:
          type: string
        source_url:
          type: string
        source_query:
          type: string
        source_evidence:
          type: string
        captured_at:
          type: string
          format: date-time
        job_detail:
          type: object
          properties:
            company_name:
              type: string
            role_title:
              type: string
            job_description:
              type: string
            contact_email:
              type: string
            application_url:
              type: string
            application_kind:
              $ref: "#/components/schemas/JobApplicationKind"
            job_stage:
              type: string
              enum: [new, saved, applied, responded, interview, rejected, ignored]
            match_score:
              type: integer
            score_explanation:
              type: string
    OpportunityMetrics:
      type: object
      required: [total, unsent, email_job_count, email_unsent_count, external_application_count, external_unapplied_count]
      properties:
        total:
          type: integer
        unsent:
          type: integer
          description: Existing compatibility metric for email jobs not sent.
        email_job_count:
          type: integer
        email_unsent_count:
          type: integer
        external_application_count:
          type: integer
        external_unapplied_count:
          type: integer
