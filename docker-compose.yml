services:
  postgres:
    image: postgres:16-alpine
    container_name: opportunity_desk_postgres
    env_file:
      - .env.local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scrapper_freelance}
      POSTGRES_USER: ${POSTGRES_USER:-scrapper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scrapper}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scrapper} -d ${POSTGRES_DB:-scrapper_freelance}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: python:3.12-slim
    container_name: opportunity_desk_api
    working_dir: /app/apps/api
    env_file:
      - .env.local
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-scrapper}:${POSTGRES_PASSWORD:-scrapper}@postgres:5432/${POSTGRES_DB:-scrapper_freelance}
      RESUME_STORAGE_BACKEND: ${RESUME_STORAGE_BACKEND:-local_fs}
      RESUME_STORAGE_DIR: ${RESUME_STORAGE_DIR:-/app/.local/resumes}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-gmail}
      GMAIL_OAUTH_CLIENT_CONFIG_JSON: ${GMAIL_OAUTH_CLIENT_CONFIG_JSON:-}
      GMAIL_OAUTH_CLIENT_SECRETS_FILE: ${DOCKER_GMAIL_OAUTH_CLIENT_SECRETS_FILE:-/app/.local/gmail/client_secret.json}
      GMAIL_OAUTH_SCOPES: ${GMAIL_OAUTH_SCOPES:-https://www.googleapis.com/auth/gmail.send}
      GOOGLE_AUTH_CLIENT_ID: ${GOOGLE_AUTH_CLIENT_ID:-}
      GOOGLE_AUTH_CLIENT_SECRET: ${GOOGLE_AUTH_CLIENT_SECRET:-}
      GOOGLE_AUTH_REDIRECT_URI: ${GOOGLE_AUTH_REDIRECT_URI:-http://localhost:8000/auth/google/callback}
      GOOGLE_AUTH_SCOPES: ${GOOGLE_AUTH_SCOPES:-openid https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile}
      GOOGLE_AUTH_SUCCESS_REDIRECT_URL: ${GOOGLE_AUTH_SUCCESS_REDIRECT_URL:-http://localhost:3000/auth/google/callback}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-12}
      AUTH_TOKEN_BYTES: ${AUTH_TOKEN_BYTES:-32}
      PASSWORD_RESET_TOKEN_TTL_MINUTES: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:-30}
      DEFAULT_LOCAL_USER_EMAIL: ${DEFAULT_LOCAL_USER_EMAIL:-local@example.com}
      DEFAULT_LOCAL_USER_DISPLAY_NAME: ${DEFAULT_LOCAL_USER_DISPLAY_NAME:-Local Operator}
    command: >
      sh -c "pip install -e . &&
             alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: python:3.12-slim
    container_name: opportunity_desk_linkedin_job_worker
    working_dir: /app/apps/worker
    env_file:
      - .env.local
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-scrapper}:${POSTGRES_PASSWORD:-scrapper}@postgres:5432/${POSTGRES_DB:-scrapper_freelance}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-5}
      WORKER_RUN_ONCE: ${WORKER_RUN_ONCE:-false}
      WORKER_MAX_RUNS_PER_LOOP: ${WORKER_MAX_RUNS_PER_LOOP:-1}
      WORKER_MARK_STALE_RUNNING_ON_STARTUP: ${WORKER_MARK_STALE_RUNNING_ON_STARTUP:-true}
      RESUME_STORAGE_BACKEND: ${RESUME_STORAGE_BACKEND:-local_fs}
      RESUME_STORAGE_DIR: ${RESUME_STORAGE_DIR:-/app/.local/resumes}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-gmail}
      EMAIL_SEND_POLL_INTERVAL_SECONDS: ${EMAIL_SEND_POLL_INTERVAL_SECONDS:-5}
      JOB_AI_FILTERS_ENABLED: ${JOB_AI_FILTERS_ENABLED:-true}
      JOB_AI_FILTER_MODEL_NAME: ${JOB_AI_FILTER_MODEL_NAME:-gpt-4o-mini}
      GMAIL_OAUTH_CLIENT_CONFIG_JSON: ${GMAIL_OAUTH_CLIENT_CONFIG_JSON:-}
      GMAIL_OAUTH_CLIENT_SECRETS_FILE: ${DOCKER_GMAIL_OAUTH_CLIENT_SECRETS_FILE:-/app/.local/gmail/client_secret.json}
      GMAIL_OAUTH_SCOPES: ${GMAIL_OAUTH_SCOPES:-https://www.googleapis.com/auth/gmail.send}
      GOOGLE_AUTH_CLIENT_ID: ${GOOGLE_AUTH_CLIENT_ID:-}
      GOOGLE_AUTH_CLIENT_SECRET: ${GOOGLE_AUTH_CLIENT_SECRET:-}
      GOOGLE_AUTH_REDIRECT_URI: ${GOOGLE_AUTH_REDIRECT_URI:-http://localhost:8000/auth/google/callback}
      GOOGLE_AUTH_SCOPES: ${GOOGLE_AUTH_SCOPES:-openid https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile}
      GOOGLE_AUTH_SUCCESS_REDIRECT_URL: ${GOOGLE_AUTH_SUCCESS_REDIRECT_URL:-http://localhost:8000/health}
      DEFAULT_LOCAL_USER_EMAIL: ${DEFAULT_LOCAL_USER_EMAIL:-local@example.com}
    command: >
      sh -c "pip install -e . &&
             python -m app.main"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: opportunity-desk-web-runtime:node22
    container_name: opportunity_desk_freelance_web
    working_dir: /app/apps/web
    env_file:
      - .env.local
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://${FREELANCE_POSTGRES_USER:-scrapper}:${FREELANCE_POSTGRES_PASSWORD:-scrapper}@freelance-postgres:5432/${FREELANCE_POSTGRES_DB:-freelance_app}
      FREELANCE_AUTH_API_BASE_URL: ${FREELANCE_AUTH_API_BASE_URL:-http://api:8000}
      FREELANCE_WEB_APP_BASE_URL: ${FREELANCE_WEB_APP_BASE_URL:-http://localhost:3000}
      FREELANCE_MAPS_PROVIDER: ${FREELANCE_MAPS_PROVIDER:-mock}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_FREELANCE_MODEL: ${AI_FREELANCE_MODEL:-gpt-4o-mini}
    command: >
      sh -c "npm install --include=dev &&
             npx prisma generate &&
             npm run db:bootstrap &&
             npm run build &&
             npm run start -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      freelance-postgres:
        condition: service_healthy

  web-worker:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: opportunity-desk-web-runtime:node22
    container_name: opportunity_desk_freelance_web_worker
    working_dir: /app/apps/web
    env_file:
      - .env.local
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://${FREELANCE_POSTGRES_USER:-scrapper}:${FREELANCE_POSTGRES_PASSWORD:-scrapper}@freelance-postgres:5432/${FREELANCE_POSTGRES_DB:-freelance_app}
      FREELANCE_MAPS_PROVIDER: ${FREELANCE_MAPS_PROVIDER:-mock}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_FREELANCE_MODEL: ${AI_FREELANCE_MODEL:-gpt-4o-mini}
    command: >
      sh -c "npm install --include=dev &&
             npx prisma generate &&
             npm run worker"
    depends_on:
      freelance-postgres:
        condition: service_healthy

  freelance-postgres:
    image: postgres:16-alpine
    container_name: opportunity_desk_freelance_postgres
    env_file:
      - .env.local
    environment:
      POSTGRES_DB: ${FREELANCE_POSTGRES_DB:-freelance_app}
      POSTGRES_USER: ${FREELANCE_POSTGRES_USER:-scrapper}
      POSTGRES_PASSWORD: ${FREELANCE_POSTGRES_PASSWORD:-scrapper}
    ports:
      - "127.0.0.1:${FREELANCE_POSTGRES_PORT:-5433}:5432"
    volumes:
      - freelance_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FREELANCE_POSTGRES_USER:-scrapper} -d ${FREELANCE_POSTGRES_DB:-freelance_app}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  freelance_postgres_data:
